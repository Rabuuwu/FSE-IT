<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FSE-IT - Register</title>
    <link rel="stylesheet" href="css/register.css">
    <script src="config.js"></script>
    <script src="utils.js"></script>
</head>
<body>
    <div class="container">
        <h1>Register</h1>
        <form id="registerForm">
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" minlength="10" required>
            </div>
            <button type="submit" class="btn" id="submitBtn">Register</button>
        </form>
        <div id="error" class="error" role="alert"></div>
        <div id="success" class="success"></div>
        <a href="index.html" class="back-link">← Back to Home</a>
    </div>

    <script>
    document.getElementById('registerForm').addEventListener('submit', async event => {
        event.preventDefault();
        const button=document.getElementById('submitBtn'), error=document.getElementById('error');
        button.disabled=true;error.style.display='none';
        try {
            const data=await api('/register',{method:'POST',body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});
            location.assign('login.html');
        } catch(err) { error.textContent=err.message;error.style.display='block'; }
        finally { button.disabled=false; }
    });
    </script>
</body>
</html>

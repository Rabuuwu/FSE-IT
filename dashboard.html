<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FSE-IT - Dashboard</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <script src="config.js"></script>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <h1>FSE-IT Dashboard</h1>
            <div>
                <span class="user-info" id="userInfo">Loading...</span>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- Navigation Menu -->
        <nav class="main-nav">
            <a href="dashboard.html" class="nav-item active">📊 Dashboard</a>
            <a href="article-viewer.html" class="nav-item">📚 Materiały</a>
            <a href="article-creator.html" class="nav-item">✏️ Utwórz</a>
            <a href="admin.html" class="nav-item" id="adminLink" style="display:none;">👑 Admin</a>
        </nav>

        <!-- Quick Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Moje Artykuły</h3>
                <p class="stat-value" id="myArticlesCount">0</p>
                <a href="article-viewer.html" class="stat-link">Przejdź →</a>
            </div>
            <div class="stat-card">
                <h3>Moje Kursy</h3>
                <p class="stat-value" id="myCoursesCount">0</p>
                <a href="article-viewer.html" class="stat-link">Przejdź →</a>
            </div>
            <div class="stat-card">
                <h3>Moje Zasoby</h3>
                <p class="stat-value" id="myResourcesCount">0</p>
                <a href="#" class="stat-link">Przejdź →</a>
            </div>
            <div class="stat-card">
                <h3>Wszystkie Materiały</h3>
                <p class="stat-value" id="totalMaterialsCount">0</p>
                <a href="article-viewer.html" class="stat-link">Przejdź →</a>
            </div>
        </div>

        <div class="section">
            <div class="resources-header">
                <h2>Moje Zasoby</h2>
                <div class="header-actions">
                    <button class="btn" onclick="toggleResourceForm()">Dodaj Zasób</button>
                    <a href="article-creator.html" class="btn" style="text-decoration: none; display: inline-block;">Utwórz Artykuł</a>
                </div>
            </div>
            
            <div id="resourceForm" class="resource-form">
                <form id="addResourceForm">
                    <div class="form-group">
                        <label for="resourceData">Dane Zasobu (format JSON):</label>
                        <textarea id="resourceData" name="data" placeholder='{"title": "Mój Zasób", "description": "Opis", "value": 123}'></textarea>
                    </div>
                    <button type="submit" class="btn" id="addBtn">Dodaj Zasób</button>
                    <button type="button" class="btn btn-secondary" onclick="toggleResourceForm()">Anuluj</button>
                </form>
            </div>
            
            <div id="error" class="error"></div>
            <div id="success" class="success"></div>
            
            <div id="resourcesList" class="resources-list">
                <div class="loading">Ładowanie zasobów...</div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let currentUser = null;
        
        // Check authentication on page load
        window.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = 'login.html';
                return;
            }
            
            loadUserInfo();
            loadResources();
            loadStatistics();
        });
        
        // Load current user information
        async function loadUserInfo() {
            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`${API_BASE}/me`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    currentUser = data.user;
                    document.getElementById('userInfo').textContent = `${currentUser.email} | Role: ${currentUser.role || 'user'}`;
                    
                    // Show admin link if user is admin
                    if (currentUser.role === 'admin') {
                        document.getElementById('adminLink').style.display = 'inline-block';
                    }
                } else {
                    throw new Error('Failed to load user info');
                }
            } catch (error) {
                console.error('Error loading user info:', error);
                document.getElementById('userInfo').textContent = 'Error loading user info';
            }
        }
        
        // Load statistics
        async function loadStatistics() {
            try {
                const token = localStorage.getItem('token');
                
                // Load user's articles
                const articlesRes = await fetch(`${API_BASE}/articles`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                let userArticles = 0;
                let totalArticles = 0;
                if (articlesRes.ok) {
                    const articles = await articlesRes.json();
                    totalArticles = articles.length;
                    userArticles = articles.filter(a => a.author_id === currentUser.user_id).length;
                }
                
                // Load user's courses
                const coursesRes = await fetch(`${API_BASE}/courses`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                let userCourses = 0;
                let totalCourses = 0;
                if (coursesRes.ok) {
                    const courses = await coursesRes.json();
                    totalCourses = courses.length;
                    userCourses = courses.filter(c => c.author_id === currentUser.user_id).length;
                }
                
                // Load resources
                const resourcesRes = await fetch(`${API_BASE}/resources`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                let userResources = 0;
                if (resourcesRes.ok) {
                    const data = await resourcesRes.json();
                    userResources = data.resources ? data.resources.length : 0;
                }
                
                // Update UI
                document.getElementById('myArticlesCount').textContent = userArticles;
                document.getElementById('myCoursesCount').textContent = userCourses;
                document.getElementById('myResourcesCount').textContent = userResources;
                document.getElementById('totalMaterialsCount').textContent = totalArticles + totalCourses;
            } catch (error) {
                console.error('Error loading statistics:', error);
            }
        }
        
        // Load user resources
        async function loadResources() {
            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`${API_BASE}/resources`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    displayResources(data.resources);
                } else if (response.status === 401) {
                    logout();
                } else {
                    throw new Error('Failed to load resources');
                }
            } catch (error) {
                console.error('Error loading resources:', error);
                showError('Błąd podczas ładowania zasobów. Spróbuj odświeżyć stronę.');
            }
        }
        
        // Display resources in the UI
        function displayResources(resources) {
            const resourcesList = document.getElementById('resourcesList');
            
            if (resources.length === 0) {
                resourcesList.innerHTML = '<div class="empty-state">Brak zasobów. Dodaj swój pierwszy zasób!</div>';
                return;
            }
            
            resourcesList.innerHTML = resources.map(resource => `
                <div class="resource-item">
                    <div class="resource-meta">
                        <span>ID: ${resource.id}</span>
                        <span>Utworzony: ${new Date(resource.created_at).toLocaleString('pl-PL')}</span>
                    </div>
                    <div class="resource-data">${JSON.stringify(resource.data, null, 2)}</div>
                </div>
            `).join('');
        }
        
        // Toggle resource form visibility
        function toggleResourceForm() {
            const form = document.getElementById('resourceForm');
            const isVisible = form.style.display === 'block';
            form.style.display = isVisible ? 'none' : 'block';
            
            if (!isVisible) {
                document.getElementById('resourceData').focus();
            } else {
                document.getElementById('resourceData').value = '';
                clearMessages();
            }
        }
        
        // Handle add resource form submission
        document.getElementById('addResourceForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const resourceDataInput = document.getElementById('resourceData');
            const addBtn = document.getElementById('addBtn');
            
            let resourceData;
            try {
                const jsonString = resourceDataInput.value.trim();
                resourceData = jsonString ? JSON.parse(jsonString) : null;
            } catch (error) {
                showError('Nieprawidłowy format JSON. Sprawdź swoje dane.');
                return;
            }
            
            addBtn.disabled = true;
            addBtn.textContent = 'Dodawanie...';
            clearMessages();
            
            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`${API_BASE}/resources`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ data: resourceData })
                });
                
                if (response.ok) {
                    showSuccess('Zasób został dodany pomyślnie!');
                    resourceDataInput.value = '';
                    toggleResourceForm();
                    loadResources();
                    loadStatistics();
                } else if (response.status === 401) {
                    logout();
                } else {
                    const errorData = await response.json();
                    showError(errorData.error || 'Błąd podczas dodawania zasobu');
                }
            } catch (error) {
                console.error('Error adding resource:', error);
                showError('Błąd sieci. Spróbuj ponownie.');
            } finally {
                addBtn.disabled = false;
                addBtn.textContent = 'Dodaj Zasób';
            }
        });
        
        // Utility functions
        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }
        
        function showSuccess(message) {
            const successDiv = document.getElementById('success');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            setTimeout(() => {
                successDiv.style.display = 'none';
            }, 3000);
        }
        
        function clearMessages() {
            document.getElementById('error').style.display = 'none';
            document.getElementById('success').style.display = 'none';
        }
        
        function logout() {
            localStorage.removeItem('token');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>

<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administracja — FSE-IT</title><link rel="stylesheet" href="css/fonts.css"><link rel="stylesheet" href="css/catalog.css"><link rel="stylesheet" href="css/theme.css"><script src="config.js" defer></script><script src="utils.js" defer></script><script src="icons.js" defer></script><script src="account-menu.js" defer></script><script src="admin.js" defer></script></head><body><a class="skip" href="#main">Przejdź do administracji</a><header class="site-header"><a class="brand" href="catalog.html"><span class="brand-mark" aria-hidden="true">F</span>FSE-IT</a><a class="back-link" href="catalog.html">Katalog</a><span id="identity" hidden></span></header><main id="main"><h1>Administracja</h1><p id="adminMessage" role="status" aria-live="polite">Sprawdzanie uprawnień…</p><div id="adminContent" hidden><section aria-labelledby="overviewTitle"><h2 id="overviewTitle">Przegląd</h2><dl id="overview" class="admin-overview"></dl></section><nav class="admin-tabs" aria-label="Sekcje administracji"><button id="pendingTab" type="button" aria-pressed="true">Do weryfikacji</button><button id="materialsTab" type="button" aria-pressed="false">Wszystkie materiały</button><button id="usersTab" type="button" aria-pressed="false">Użytkownicy</button></nav><section id="materialsSection"><h2 id="queueTitle">Materiały do weryfikacji</h2><label id="statusFilter" hidden>Stan materiału<select id="adminStatus" aria-label="Stan materiału"><option value="">Wszystkie stany</option><option value="private">Prywatne</option><option value="pending">Oczekujące</option><option value="rejected">Do poprawy</option><option value="published">Publiczne</option></select></label><p id="queueMessage" role="status" aria-live="polite"></p><button id="queueRetry" type="button" class="secondary" hidden>Spróbuj ponownie</button><div id="queueItems" class="material-list"></div><div class="pagination"><button id="previous">Poprzednia</button><span id="pageInfo"></span><button id="next">Następna</button></div></section><section id="usersSection" hidden><h2>Użytkownicy</h2><p>Usunięcie konta jest nieodwracalne. Opublikowane materiały pozostają w katalogu.</p><p id="usersMessage" role="status"></p><div id="userItems"></div></section></div></main><dialog id="reviewDialog" aria-labelledby="reviewTitle"><button id="closeReview" class="secondary" type="button">Zamknij podgląd</button><h2 id="reviewTitle">Podgląd materiału</h2><p id="reviewMeta"></p><div id="reviewBody" class="reading-content"></div><form id="reviewForm"><label>Uwagi do autora<textarea id="reviewReason" maxlength="2000" rows="4" placeholder="Przy odrzuceniu wyjaśnij, co wymaga poprawy"></textarea></label><p id="reviewMessage" role="status" aria-live="polite"></p><div class="actions"><button id="approve" type="submit" value="approve">Zatwierdź i opublikuj</button><button id="reject" type="submit" value="reject" class="danger">Odrzuć do poprawy</button></div></form></dialog></body></html>

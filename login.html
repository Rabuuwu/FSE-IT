<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FSE-IT - Login</title>
    <link rel="stylesheet" href="css/login.css">
    <script src="config.js"></script>
    <script src="utils.js"></script>
</head>
<body>
    <div class="container">
        <h1>Login</h1>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn" id="submitBtn">Login</button>
        </form>
        <div id="error" class="error" role="alert"></div>
        <div id="success" class="success"></div>
        <div class="links">
            <a href="index.html">← Back to Home</a>
            <a href="register.html">Don't have an account? Register</a>
        </div>
    </div>

    <script>
    document.getElementById('loginForm').addEventListener('submit', async event => {
        event.preventDefault();
        const button=document.getElementById('submitBtn'), error=document.getElementById('error');
        button.disabled=true;error.style.display='none';
        try {
            const data=await api('/login',{method:'POST',body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});
            localStorage.setItem('token',data.token);location.assign('catalog.html');
        } catch(err) { error.textContent=err.message;error.style.display='block'; }
        finally { button.disabled=false; }
    });
    </script>
</body>
</html>
